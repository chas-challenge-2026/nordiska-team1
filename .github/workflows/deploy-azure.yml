name: Deploy to Azure Container Apps

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build & Deploy to Azure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Web App Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: final
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/nordiska-sparbanken:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/nordiska-sparbanken:${{ github.sha }}

      - name: Build and push Reporting Worker Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: reporting-worker
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/nordiska-reporting-worker:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/nordiska-reporting-worker:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up .NET 8 SDK for Database Migrations
        uses: actions/setup-dotnet@v4
        if: env.AZURE_MIGRATOR_CONNECTION_STRING != ''
        env:
          AZURE_MIGRATOR_CONNECTION_STRING: ${{ secrets.AZURE_MIGRATOR_CONNECTION_STRING }}
        with:
          dotnet-version: '8.0.x'

      - name: Run Database Migrations (Banking, Inbox, Faq, Reporting)
        if: env.AZURE_MIGRATOR_CONNECTION_STRING != ''
        env:
          AZURE_MIGRATOR_CONNECTION_STRING: ${{ secrets.AZURE_MIGRATOR_CONNECTION_STRING }}
        run: |
          chmod +x ./backend/scripts/migrate-database.sh
          ./backend/scripts/migrate-database.sh "$AZURE_MIGRATOR_CONNECTION_STRING"

      - name: Deploy to Azure Container Apps
        if: env.AZURE_CREDENTIALS != ''
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          RG: ${{ secrets.AZURE_RESOURCE_GROUP || 'rg-nordiska-prod' }}
          APP_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/nordiska-sparbanken:${{ github.sha }}
          WORKER_IMAGE: ${{ secrets.ACR_LOGIN_SERVER }}/nordiska-reporting-worker:${{ github.sha }}
        run: |
          # 1. Update Web App container
          az containerapp update \
            --name nordiska-sparbanken \
            --resource-group "$RG" \
            --container-name nordiska-app \
            --image "$APP_IMAGE"

          # 2. Add or update reporting worker container
          if az containerapp show --name nordiska-sparbanken --resource-group "$RG" --query "properties.template.containers[?name=='nordiska-reporting-worker']" -o tsv | grep -q 'nordiska-reporting-worker'; then
            echo "Updating existing nordiska-reporting-worker container..."
            az containerapp container set \
              --name nordiska-sparbanken \
              --resource-group "$RG" \
              --container-name nordiska-reporting-worker \
              --image "$WORKER_IMAGE"
          else
            echo "Adding new nordiska-reporting-worker container..."
            az containerapp container add \
              --name nordiska-sparbanken \
              --resource-group "$RG" \
              --container-name nordiska-reporting-worker \
              --image "$WORKER_IMAGE" \
              --cpu 0.25 --memory 0.5Gi \
              --set-env-vars NORDISKA_PDF_ENABLE_SIGNING=0 ReportDocumentStorage__RootPath=/var/lib/nordiska/report-documents ConnectionStrings__ReportingDatabase=secretref:db-connection
          fi

      - name: Deployment status summary
        run: |
          echo "### Image Built & Deployed to Azure successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Registry:** ${{ secrets.ACR_LOGIN_SERVER }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Azure Container App:** https://nordiska-sparbanken.nicecliff-4353e1fb.swedencentral.azurecontainerapps.io" >> $GITHUB_STEP_SUMMARY