name: CI Pipeline

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Verify Platform Contract
  infra-guard:
    name: Platform Contract Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify Platform Contract (DRIFT.md)
        run: |
          pip install pyyaml --quiet
          python3 .github/scripts/infra_guard.py

  # Frontend lint and typecheck build
  frontend-ci:
    name: Frontend (ESLint & TypeScript Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Verify TypeScript & Vite Build
        run: npm run build

  # Backend restore, build and test execution
  backend-ci:
    name: Backend (.NET 8 Locked Restore, Build & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet Packages (Locked Mode)
        run: dotnet restore backend/np.sln --locked-mode

      - name: Build Solution (Release, TreatWarningsAsErrors)
        run: dotnet build backend/np.sln --configuration Release --no-restore

      - name: Run Unit and Integration Tests
        run: dotnet test backend/np.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test_results.trx"

  # Smoke test production container build
  docker-build-check:
    name: Fullstack Docker Build Verification
    needs: [infra-guard, frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: nordiska-portal:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
