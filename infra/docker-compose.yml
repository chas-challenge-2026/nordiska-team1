name: nordiska-v2

services:
  db:
    image: postgres:15-bookworm
    restart: unless-stopped
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: nordiska_v2
      POSTGRES_USER: nordiska_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      NORDISKA_MIGRATOR_PASSWORD: ${NORDISKA_MIGRATOR_PASSWORD}
      NORDISKA_API_PASSWORD: ${NORDISKA_API_PASSWORD}
      NORDISKA_REPORTING_WORKER_PASSWORD: ${NORDISKA_REPORTING_WORKER_PASSWORD}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/permissions/post-migration-permissions.sql:/opt/nordiska/post-migration-permissions.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrator:
    build:
      context: ../
      dockerfile: Dockerfile
      target: migrator
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      MIGRATION_CONNECTION_STRING: >-
        Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_migrator;Password=${NORDISKA_MIGRATOR_PASSWORD}

  app:
    build:
      context: ../
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD}
      ConnectionStrings__BankingDatabase: >-
        Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD}
      ConnectionStrings__FaqDatabase: >-
        Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD}
      ConnectionStrings__ReportingDatabase: >-
        Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD}
      ConnectionStrings__InboxDatabase: >-
        Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD}
      Jwt__SecretKey: ${NORDISKA_JWT_SECRET}
      Jwt__Issuer: NordiskaSparbanken
      Jwt__Audience: NordiskaSparbankenPortal
      AuditLogging__SigningKey: ${NORDISKA_AUDIT_SIGNING_KEY}
      AdminUser__Password: ${ADMIN_USER_PASSWORD}
      FaqSearchLog__Salt: ${FAQ_SEARCH_LOG_SALT}
      ActiveLogin__BankId__Environment: ${ACTIVE_LOGIN_BANKID_ENVIRONMENT:-Simulated}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      ReportDocumentStorage__RootPath: /var/lib/nordiska/report-documents
    volumes:
      - report_documents:/var/lib/nordiska/report-documents:ro
    expose:
      - "8080"

  reporting-worker:
    build:
      context: ../
      dockerfile: Dockerfile
      target: reporting-worker
    restart: unless-stopped
    stop_grace_period: 35s
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      ConnectionStrings__ReportingDatabase: >-
        Host=db;Port=5432;Database=${NORDISKA_DATABASE:-nordiska_v2};Username=nordiska_reporting_worker;Password=${NORDISKA_REPORTING_WORKER_PASSWORD}
      ReportDocumentStorage__RootPath: /var/lib/nordiska/report-documents
      TaxReportWorker__Concurrency: "${REPORTING_WORKER_CONCURRENCY:-12}"
      NORDISKA_PDF_ENABLE_SIGNING: "${NORDISKA_PDF_ENABLE_SIGNING:-0}"
      PDF_SIGNER_MODE: "${PDF_SIGNER_MODE:-plain}"
      PDF_SIGNER_SOCKET_PATH: /run/pdf-signer/pdf-signer.sock
    volumes:
      - report_documents:/var/lib/nordiska/report-documents
      - pdf_signer_socket:/run/pdf-signer

  pdf-signer:
    build:
      context: ../
      dockerfile: native/pdf-signer/docker/Dockerfile.service

    entrypoint:
      - bash
      - /app/docker/service-entrypoint-lf.sh

    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

    environment:
      NORDISKA_PDF_ENABLE_SIGNING: "1"
      PDF_OUTPUT_DIRECTORY: /var/lib/nordiska/report-documents
      ConnectionStrings__ReportingDatabase: >-
        Host=db;Port=5432;Database=${NORDISKA_DATABASE:-nordiska_v2};Username=nordiska_reporting_worker;Password=${NORDISKA_REPORTING_WORKER_PASSWORD}
      PDF_SIGNER_PKCS11_PROVIDER: pkcs11
      PDF_SIGNER_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      PDF_SIGNER_PKCS11_URI: "pkcs11:token=key-load-dev;object=pdf-signer-test;type=private"
      PDF_SIGNER_CERT_PATH: /app/tests/data/signing_cert.pem
      PDF_SIGNER_TSA_CERT_PATH: /app/tests/data/tsa_cert.pem
      PDF_SIGNER_SOCKET_PATH: /run/pdf-signer/pdf-signer.sock
      PDF_SIGNER_TSA_URL: "${PDF_SIGNER_TSA_URL:-http://127.0.0.1:8081/}"
      PDF_SIGNER_PKCS11_PIN: ${PDF_SIGNER_PKCS11_PIN:?Set PDF_SIGNER_PKCS11_PIN}
      PDF_SIGNER_PKCS11_SO_PIN: ${PDF_SIGNER_PKCS11_SO_PIN:?Set PDF_SIGNER_PKCS11_SO_PIN}

    volumes:
      - report_documents:/var/lib/nordiska/report-documents
      - pdf_signer_socket:/run/pdf-signer

volumes:
  postgres_v2_data:
  report_documents:
    name: ${NORDISKA_REPORT_DOCUMENTS_VOLUME:-nordiska-v2_report_documents}
  pdf_signer_socket:

