name: nordiska

services:
  # PostgreSQL 15 database
  db:
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: nordiska_v2
      POSTGRES_USER: nordiska_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-bootstrap_secret_123}
      NORDISKA_MIGRATOR_PASSWORD: ${NORDISKA_MIGRATOR_PASSWORD:-migrator_secret_123}
      NORDISKA_API_PASSWORD: ${NORDISKA_API_PASSWORD:-api_secret_123}
      NORDISKA_REPORTING_WORKER_PASSWORD: ${NORDISKA_REPORTING_WORKER_PASSWORD:-worker_secret_123}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./v2/postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # .NET 8 Web API + React SPA
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__BankingDatabase=Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_migrator;Password=${NORDISKA_MIGRATOR_PASSWORD:-migrator_secret_123}
      - ConnectionStrings__FaqDatabase=Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_migrator;Password=${NORDISKA_MIGRATOR_PASSWORD:-migrator_secret_123}
      - ConnectionStrings__ReportingDatabase=Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_migrator;Password=${NORDISKA_MIGRATOR_PASSWORD:-migrator_secret_123}
      - Jwt__SecretKey=SuperSecretKeyForNordiskaSparbankenDevelopmentJWTToken2026!
      - Jwt__Issuer=NordiskaSparbanken
      - Jwt__Audience=NordiskaSparbankenPortal
      - Jwt__TokenLifetimeInMinutes=15
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_v2_data:
