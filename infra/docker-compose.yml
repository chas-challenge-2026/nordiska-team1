name: nordiska

services:
  # PostgreSQL 15 database
  db:
    image: postgres:15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: nordiska_v2
      POSTGRES_USER: nordiska_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:-nordiska_admin_2026}
      NORDISKA_MIGRATOR_PASSWORD: ${NORDISKA_MIGRATOR_PASSWORD:-nordiska_migrator_2026}
      NORDISKA_API_PASSWORD: ${NORDISKA_API_PASSWORD:-nordiska_api_2026}
      NORDISKA_REPORTING_WORKER_PASSWORD: ${NORDISKA_REPORTING_WORKER_PASSWORD:-nordiska_worker_2026}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./v2/postgres/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Automated database schema migrator
  migrator:
    build:
      context: ..
      dockerfile: Dockerfile
      target: migrator
    environment:
      - MIGRATION_CONNECTION_STRING=Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_migrator;Password=${NORDISKA_MIGRATOR_PASSWORD:-nordiska_migrator_2026}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # .NET 8 Web API + React SPA
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: final
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__BankingDatabase=Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD:-nordiska_api_2026}
      - ConnectionStrings__FaqDatabase=Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD:-nordiska_api_2026}
      - ConnectionStrings__ReportingDatabase=Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD:-nordiska_api_2026}
      - ConnectionStrings__InboxDatabase=Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_api;Password=${NORDISKA_API_PASSWORD:-nordiska_api_2026}
      - ActiveLogin__BankId__Environment=Test
      - Jwt__SecretKey=${NORDISKA_JWT_SECRET:-SuperSecretDefaultKeyForNordiska2026!}
      - Jwt__Issuer=NordiskaSparbanken
      - Jwt__Audience=NordiskaSparbankenPortal
      - Jwt__TokenLifetimeInMinutes=15
      - FaqSearchLog__Salt=${FAQ_SEARCH_LOG_SALT:-nordiska-faq-search-salt-dev}

    volumes:
      - ../output:/var/lib/nordiska/report-documents
      - pdf_signer_socket:/run/pdf-signer

    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  # Native PDF-signing service
  pdf-signer:
    build:
      context: ..
      dockerfile: native/pdf-signer/docker/Dockerfile.service
    restart: unless-stopped

    environment:
      NORDISKA_PDF_ENABLE_SIGNING: "0"
      PDF_OUTPUT_DIRECTORY: /output
      ConnectionStrings__ReportingDatabase: "Host=db;Port=5432;Database=nordiska_v2;Username=nordiska_reporting_worker;Password=${NORDISKA_REPORTING_WORKER_PASSWORD:-nordiska_worker_2026}"

      PDF_SIGNER_PKCS11_PROVIDER: pkcs11
      PDF_SIGNER_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      PDF_SIGNER_PKCS11_URI: "pkcs11:token=key-load-dev;object=pdf-signer-test;type=private"
      PDF_SIGNER_CERT_PATH: /app/tests/data/signing_cert.pem
      PDF_SIGNER_TSA_CERT_PATH: /app/tests/data/tsa_cert.pem
      PDF_SIGNER_SOCKET_PATH: /run/pdf-signer/pdf-signer.sock
      PDF_SIGNER_TSA_URL: http://127.0.0.1:8081/

    secrets:
      - pdf_signer_pkcs11_pin
      - pdf_signer_pkcs11_so_pin

    volumes:
      - ../output:/output
      - pdf_signer_socket:/run/pdf-signer

    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_v2_data:
  pdf_signer_socket:

secrets:
  pdf_signer_pkcs11_pin:
    file: ../secrets/pdf_signer_pkcs11_pin.txt

  pdf_signer_pkcs11_so_pin:
    file: ../secrets/pdf_signer_pkcs11_so_pin.txt