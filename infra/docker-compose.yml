version: "3.8"
name: nordiska

services:
  db:
    image: postgres:12
    environment:
      POSTGRES_DB: nordiska
      POSTGRES_USER: nordiska
      POSTGRES_PASSWORD: nordiska123
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nordiska"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ../backend/NordiskaPortal
      dockerfile: Dockerfile
    expose:
      - "8080"
    environment:
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
