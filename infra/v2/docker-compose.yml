name: nordiska-v2

services:
  db:
    image: postgres:15-bookworm
    restart: unless-stopped
    shm_size: 128mb
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: nordiska_v2
      POSTGRES_USER: nordiska_bootstrap
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?Set POSTGRES_BOOTSTRAP_PASSWORD in infra/v2/.env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      NORDISKA_MIGRATOR_PASSWORD: ${NORDISKA_MIGRATOR_PASSWORD:?Set NORDISKA_MIGRATOR_PASSWORD in infra/v2/.env}
      NORDISKA_API_PASSWORD: ${NORDISKA_API_PASSWORD:?Set NORDISKA_API_PASSWORD in infra/v2/.env}
      NORDISKA_REPORTING_WORKER_PASSWORD: ${NORDISKA_REPORTING_WORKER_PASSWORD:?Set NORDISKA_REPORTING_WORKER_PASSWORD in infra/v2/.env}
    volumes:
      - postgres_v2_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/permissions/post-migration-permissions.sql:/opt/nordiska/post-migration-permissions.sql:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  pdf-signer:
    build:
      context: ../..
      dockerfile: native/pdf-signer/docker/Dockerfile.service
    restart: unless-stopped
    environment:
      PDF_SIGNER_PKCS11_PROVIDER: pkcs11
      PDF_SIGNER_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
      PDF_SIGNER_PKCS11_URI: "pkcs11:token=key-load-dev;object=pdf-signer-test;type=private"
      PDF_SIGNER_CERT_PATH: /app/tests/data/signing_cert.pem
      PDF_SIGNER_TSA_CERT_PATH: /app/tests/data/tsa_cert.pem
      PDF_SIGNER_SOCKET_PATH: /run/pdf-signer/pdf-signer.sock
      PDF_SIGNER_TSA_URL: http://127.0.0.1:8081/
    volumes:
      - pdf_signer_socket:/run/pdf-signer
    secrets:
      - pdf_signer_pkcs11_pin
      - pdf_signer_pkcs11_so_pin

volumes:
  postgres_v2_data:
  pdf_signer_socket:

secrets:
  pdf_signer_pkcs11_pin:
    file: ../../secrets/pdf_signer_pkcs11_pin.txt

  pdf_signer_pkcs11_so_pin:
    file: ../../secrets/pdf_signer_pkcs11_so_pin.txt
